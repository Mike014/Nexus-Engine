name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore backend-csharp/NexusEngine.Api.csproj
      - name: Build
        run: dotnet build backend-csharp/NexusEngine.Api.csproj --no-restore
      - name: Restore Tests
        run: dotnet restore backend-csharp.Tests/NexusEngine.Tests.csproj
      - name: Build Tests
        run: dotnet build backend-csharp.Tests/NexusEngine.Tests.csproj --no-restore
      - name: Test
        run: dotnet test backend-csharp.Tests/NexusEngine.Tests.csproj --no-build --verbosity normal