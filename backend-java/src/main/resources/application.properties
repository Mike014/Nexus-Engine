spring.application.name=NexusEngine

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexusdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nexus}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nexus_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator
management.endpoints.web.exposure.include=health,info