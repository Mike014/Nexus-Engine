# Railway: native .NET build via Railpack (no Dockerfile).
# Service settings required in the Railway dashboard:
#   - Root Directory: backend-csharp
#   - Config file path: /railway.toml
#   - Variable ConnectionStrings__DefaultConnection -> Railway Postgres
#   - Serverless / App Sleeping: OFF (keeps the engine and its in-memory book always up)

[build]
builder = "RAILPACK"
buildCommand = "dotnet publish NexusEngine.Api.csproj -c Release -o out"
watchPatterns = ["backend-csharp/**"]

[deploy]
startCommand = "dotnet out/NexusEngine.Api.dll"
healthcheckPath = "/health/ready"
healthcheckTimeout = 60
restartPolicyType = "always"
numReplicas = 1
